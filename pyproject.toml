[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mes-intelligence"
version = "0.1.0"
description = "Python MES for the ERP-Intelligence shop floor: ISA-95 Unified Namespace over MQTT"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["paho-mqtt>=2.1,<3"]

[project.scripts]
mes = "mes.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=mes --cov-report=term-missing --cov-fail-under=80"
