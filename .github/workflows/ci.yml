# Verification gates, the same order as ERP-Intelligence:
#   verify  Python MES: lint -> SAST -> dependency audit -> tests with coverage >= 80% (against a real Mosquitto)
#   edge    Rust edge agent: format -> clippy (warnings are errors, docs required) -> tests (against Mosquitto)
#   docker  both images build
name: MES CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      MQTT_URL: mqtt://localhost:1883   # turns on tests/test_mqtt.py
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Not a service container: Mosquitto 2 only accepts remote clients with a config file, and
      # service containers cannot be given a command. The image ships a no-auth config for testing.
      - name: Start MQTT broker (Mosquitto)
        run: docker run -d --name mosquitto -p 1883:1883 eclipse-mosquitto:2.0.20 mosquitto -c /mosquitto-no-auth.conf

      - name: Lint (flake8)
        run: flake8 .

      - name: Static security scan (bandit)
        run: bandit -r src -ll

      - name: Dependency vulnerability audit (pip-audit)
        run: pip-audit -r requirements.txt

      - name: Tests with coverage floor
        run: pytest

  edge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edge
    env:
      MQTT_URL: mqtt://localhost:1883   # turns on the Mosquitto tests in edge/tests/end_to_end.rs
    steps:
      - uses: actions/checkout@v4

      # The runner image ships rustup; the crate has no dependencies, so nothing else is downloaded.
      - name: Rust toolchain (stable, rustfmt, clippy)
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable

      - name: Start MQTT broker (Mosquitto)
        run: docker run -d --name mosquitto -p 1883:1883 eclipse-mosquitto:2.0.20 mosquitto -c /mosquitto-no-auth.conf

      - name: Format (rustfmt)
        run: cargo fmt --check

      - name: Lint (clippy, warnings are errors)
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests (unit, end to end, against Mosquitto)
        run: cargo test --locked

  docker:
    needs: [verify, edge]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the MES image
        run: docker build -t mes-intelligence:ci .
      - name: Build the edge image (agent and simulated PLC)
        run: docker build -t mes-edge:ci edge
      # Both languages together: Mosquitto, the Python MES, the Rust edge agent and the PLC.
      - name: End to end with Docker Compose
        run: bash scripts/e2e.sh
